name: ROS 2 Jazzy Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ros2-jazzy-build-and-test:
    name: Build & Verify under native ROS 2 Jazzy
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    env:
      # Fail-closed guard: prevent silent test skipping inside official ROS 2 container
      QERRA_REQUIRE_ROS2: "1"

    steps:
      - name: Checkout repository into workspace
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/qerra_core

      - name: Install build tools and dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # 1. Resilient DNS fallback inside container
          echo "nameserver 8.8.8.8" > /etc/resolv.conf || true
          echo "nameserver 1.1.1.1" >> /etc/resolv.conf || true

          # 2. Bounded retries and timeouts for package manager
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )

          UPDATED=0
          for attempt in 1 2 3; do
            echo "[CI] apt-get update attempt ${attempt}/3"
            if apt-get "${APT_OPTS[@]}" update; then
              UPDATED=1
              break
            fi
            echo "[CI] apt-get update attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done

          if [ "$UPDATED" -ne 1 ]; then
            echo "[CI] ERROR: Ubuntu package indexes could not be updated after 3 attempts."
            exit 1
          fi

          # 3. Install required build tools and utilities
          apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            procps

          rosdep update
          cd ros2_ws
          rosdep install --from-paths src/qerra_core --ignore-src -r -y --rosdistro jazzy

      - name: Verify workspace discovery and build qerra_core
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          cd ros2_ws
          # Standard colcon discovery: should discover qerra_core and ignore qerra_msgs
          colcon list
          colcon build --packages-select qerra_core

      - name: Verify ROS 2 package and executable discovery
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          EXEC_LIST="$(ros2 pkg executables qerra_core)"
          echo "$EXEC_LIST"
          echo "$EXEC_LIST" | grep -q "qerra_gate_node"

      - name: Verify ROS 2 launch file discovery and arguments
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          PREFIX="$(ros2 pkg prefix qerra_core)"
          echo "[CI-TEST] Checking installed launch file at $PREFIX/share/qerra_core/launch/qerra_gate.launch.py"
          test -f "$PREFIX/share/qerra_core/launch/qerra_gate.launch.py"
          echo "[CI-TEST] Inspecting launch arguments via ros2 launch --show-args:"
          ros2 launch qerra_core qerra_gate.launch.py --show-args

      - name: Verify live launch execution, remapping, and graceful termination
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd /tmp

          set +e
          # Start gate node via official ros2 launch in background with Pattern B remappings
          PYTHONUNBUFFERED=1 ros2 launch qerra_core qerra_gate.launch.py \
            hsr_source:=none \
            hsr_required:=false \
            cmd_vel_in:=/cmd_vel_nav \
            cmd_vel_out:=/base/cmd_vel > /tmp/ros2_launch.log 2>&1 &
          LAUNCH_PID=$!

          # Capture exactly one diagnostic message from /gate/state (timeout after 12s)
          timeout 12 ros2 topic echo --once /gate/state > /tmp/launch_gate_state.txt
          ECHO_CODE=$?

          # Initiate graceful shutdown: send SIGINT directly to launch process parent
          kill -INT "$LAUNCH_PID" 2>/dev/null || true

          for i in $(seq 1 80); do
            if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          # Fallback escalation if launch process fails to stop within 8s
          if kill -0 "$LAUNCH_PID" 2>/dev/null; then
            echo "[CI-TEST] WARNING: Launch process did not terminate within 8s after SIGINT; sending SIGTERM"
            kill -TERM "$LAUNCH_PID" 2>/dev/null || true
            sleep 1
          fi

          if kill -0 "$LAUNCH_PID" 2>/dev/null; then
            echo "[CI-TEST] FAILURE: Launch process did not terminate gracefully; force-killing"
            kill -KILL "$LAUNCH_PID" 2>/dev/null || true
            wait "$LAUNCH_PID" 2>/dev/null
            exit 1
          fi

          wait "$LAUNCH_PID" 2>/dev/null
          LAUNCH_EXIT=$?

          echo "=== [CI-TEST] /tmp/ros2_launch.log ==="
          cat /tmp/ros2_launch.log
          echo "=== [CI-TEST] /tmp/launch_gate_state.txt ==="
          cat /tmp/launch_gate_state.txt
          echo "[CI-TEST] Launch exit code: $LAUNCH_EXIT, Topic echo exit code: $ECHO_CODE"

          # 1. Topic echo must succeed
          if [ "$ECHO_CODE" -ne 0 ]; then
            echo "[CI-TEST] FAILURE: Failed to capture /gate/state message from launched node within 12s!"
            exit 1
          fi

          # 2. Gate state message must be non-empty
          if [ ! -s /tmp/launch_gate_state.txt ]; then
            echo "[CI-TEST] FAILURE: Captured /gate/state message is empty!"
            exit 1
          fi

          # 3. No tick exceptions in launch log
          if grep -q "Tick exception" /tmp/ros2_launch.log; then
            echo "[CI-TEST] FAILURE: Launch log reported tick exception(s)!"
            exit 1
          fi

          # 4. Assert clean termination: must exit cleanly (0 or standard signal codes 130/143)
          if [ "$LAUNCH_EXIT" -ne 0 ] && [ "$LAUNCH_EXIT" -ne 130 ] && [ "$LAUNCH_EXIT" -ne 143 ]; then
            echo "[CI-TEST] FAILURE: Launch process did not shut down cleanly (exit code $LAUNCH_EXIT)!"
            exit 1
          fi

      - name: Verify installed executable starts, ticks without exception, and publishes gate state
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          PREFIX="$(ros2 pkg prefix qerra_core)"
          cd /tmp

          set +e
          # Run node in background with unbuffered output captured to log
          PYTHONUNBUFFERED=1 "$PREFIX/lib/qerra_core/qerra_gate_node" > /tmp/qerra_gate_node.log 2>&1 &
          NODE_PID=$!

          # Capture exactly one message from /gate/state (timeout after 10s)
          timeout 10 ros2 topic echo --once /gate/state > /tmp/gate_state_msg.txt
          ECHO_CODE=$?

          # Signal node to stop via SIGINT
          kill -INT "$NODE_PID" 2>/dev/null || true
          for i in $(seq 1 50); do
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$NODE_PID" 2>/dev/null; then
            echo "[CI-TEST] WARNING: Node did not terminate after SIGINT within 5s; sending SIGKILL"
            kill -KILL "$NODE_PID" 2>/dev/null || true
          fi
          wait "$NODE_PID" 2>/dev/null
          NODE_EXIT=$?

          # Always display logs for diagnostic verification in CI output
          echo "=== [CI-TEST] /tmp/qerra_gate_node.log ==="
          cat /tmp/qerra_gate_node.log
          echo "=== [CI-TEST] /tmp/gate_state_msg.txt ==="
          cat /tmp/gate_state_msg.txt
          echo "[CI-TEST] Node exit code: $NODE_EXIT, Topic echo exit code: $ECHO_CODE"

          # 1. Topic echo must succeed
          if [ "$ECHO_CODE" -ne 0 ]; then
            echo "[CI-TEST] FAILURE: Failed to capture /gate/state message within 10s (exit code $ECHO_CODE)"
            exit 1
          fi

          # 2. Gate state message must be non-empty
          if [ ! -s /tmp/gate_state_msg.txt ]; then
            echo "[CI-TEST] FAILURE: /tmp/gate_state_msg.txt is empty"
            exit 1
          fi

          # 3. No tick exceptions may be logged
          if grep -q "Tick exception" /tmp/qerra_gate_node.log; then
            echo "[CI-TEST] FAILURE: Node logged tick exception(s)!"
            exit 1
          fi
          
          # 4. Node must exit cleanly after SIGINT
          if [ "$NODE_EXIT" -ne 0 ]; then
            echo "[CI-TEST] FAILURE: Node did not exit cleanly (code $NODE_EXIT) after SIGINT!"
            exit 1
          fi

      - name: Verify real rclpy node initialization and lifecycle
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -c "
          import rclpy
          from ros2.qerra_gate_node import QerraGateNode

          rclpy.init()
          node = QerraGateNode()
          print(f'[CI-TEST] Successfully instantiated {node.get_name()} under real rclpy!')
          assert node._lidar_n_expected == 682
          assert node._hsr_required is True
          assert node._hsr_source == 'udp'
          assert node._hsr_port == 5008
          node.destroy_node()
          rclpy.shutdown()
          print('[CI-TEST] Node lifecycle destroyed cleanly fail-closed.')
          "

      - name: Run ROS 2 gate node unit and wiring tests in Jazzy
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest -v tests/test_gate_ros2_node.py
          python3 -m unittest -v tests/test_gate_ros2_node_wiring.py

      - name: Run live ROS 2 topic traffic integration tests in Jazzy (Priority P9)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest -v tests/test_gate_ros2_live_traffic.py

      - name: Run live dual-protocol integration tests in Jazzy (Priority P10)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest -v tests/test_gate_ros2_dual_protocol.py

      - name: Run live ROS 2 topic remapping integration test in Jazzy (Pattern B)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest -v tests/test_gate_ros2_remapping.py

      - name: Run live Nav2 exterior integration tests in Jazzy (Pattern B / Nav2)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest -v tests/test_gate_ros2_nav2_exterior.py
