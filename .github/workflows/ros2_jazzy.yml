name: ROS 2 Jazzy Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ros2-jazzy-build-and-test:
    name: Build & Verify under native ROS 2 Jazzy
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy

    steps:
      - name: Checkout repository into workspace
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/qerra_core

      - name: Install build tools and message dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          rosdep update
          cd ros2_ws
          rosdep install --from-paths src/qerra_core src/qerra_core/src/qerra_msgs --ignore-src -r -y --rosdistro jazzy

      - name: Build qerra_msgs and qerra_core with colcon
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon list --paths src/qerra_core src/qerra_core/src/qerra_msgs
          colcon build --paths src/qerra_core src/qerra_core/src/qerra_msgs --packages-select qerra_msgs qerra_core

      - name: Verify qerra_msgs action interface generation
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          ros2 interface show qerra_msgs/action/QerraEvaluate
          python3 -c "
          from qerra_msgs.action import QerraEvaluate

          goal = QerraEvaluate.Goal()
          goal.situation_text = 'emergency_stop_request'
          goal.distress_confidence = 0.95
          goal.persons_nearby_count = 2
          goal.hazard_proximity_flag = True
          goal.robot_task_interruptible = False

          result = QerraEvaluate.Result()
          result.score = 0.85
          result.decision = 'modified'
          result.score_explanation = 'critical ethical concern'
          result.reasoning = 'v004 startle avoidance'
          result.vectors_activated = ['v004', 'v003']
          result.evaluation_source_local = True
          result.success = True
          result.error_message = ''

          feedback = QerraEvaluate.Feedback()
          feedback.status = 'evaluating'

          print('[CI-TEST] Successfully verified QerraEvaluate Action (Goal, Result, Feedback)!')
          "

      - name: Verify ROS 2 package and executable discovery
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          EXEC_LIST="$(ros2 pkg executables qerra_core)"
          echo "$EXEC_LIST"
          echo "$EXEC_LIST" | grep -q "qerra_gate_node"

      - name: Verify ROS 2 launch file discovery and arguments
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          PREFIX="$(ros2 pkg prefix qerra_core)"
          echo "[CI-TEST] Checking installed launch file at $PREFIX/share/qerra_core/launch/qerra_gate.launch.py"
          test -f "$PREFIX/share/qerra_core/launch/qerra_gate.launch.py"
          echo "[CI-TEST] Inspecting launch arguments via ros2 launch --show-args:"
          ros2 launch qerra_core qerra_gate.launch.py --show-args

      - name: Verify installed executable starts, ticks without exception, and publishes gate state
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          PREFIX="$(ros2 pkg prefix qerra_core)"
          cd /tmp

          set +e
          # Run node in background with unbuffered output captured to log
          PYTHONUNBUFFERED=1 "$PREFIX/lib/qerra_core/qerra_gate_node" > /tmp/qerra_gate_node.log 2>&1 &
          NODE_PID=$!

          # Capture exactly one message from /gate/state (timeout after 10s)
          timeout 10 ros2 topic echo --once /gate/state > /tmp/gate_state_msg.txt
          ECHO_CODE=$?

          # Signal node to stop via SIGINT
          kill -INT "$NODE_PID" 2>/dev/null || true
          for i in $(seq 1 50); do
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$NODE_PID" 2>/dev/null; then
            echo "[CI-TEST] WARNING: Node did not terminate after SIGINT within 5s; sending SIGKILL"
            kill -KILL "$NODE_PID" 2>/dev/null || true
          fi
          wait "$NODE_PID" 2>/dev/null
          NODE_EXIT=$?

          # Always display logs for diagnostic verification in CI output
          echo "=== [CI-TEST] /tmp/qerra_gate_node.log ==="
          cat /tmp/qerra_gate_node.log
          echo "=== [CI-TEST] /tmp/gate_state_msg.txt ==="
          cat /tmp/gate_state_msg.txt
          echo "[CI-TEST] Node exit code: $NODE_EXIT, Topic echo exit code: $ECHO_CODE"

          # 1. Topic echo must succeed
          if [ "$ECHO_CODE" -ne 0 ]; then
            echo "[CI-TEST] FAILURE: Failed to capture /gate/state message within 10s (exit code $ECHO_CODE)"
            exit 1
          fi

          # 2. Gate state message must be non-empty
          if [ ! -s /tmp/gate_state_msg.txt ]; then
            echo "[CI-TEST] FAILURE: /tmp/gate_state_msg.txt is empty"
            exit 1
          fi

          # 3. No tick exceptions may be logged
          if grep -q "Tick exception" /tmp/qerra_gate_node.log; then
            echo "[CI-TEST] FAILURE: Node logged tick exception(s)!"
            exit 1
          fi
          
          # 4. Node must exit cleanly after SIGINT
          if [ "$NODE_EXIT" -ne 0 ]; then
            echo "[CI-TEST] FAILURE: Node did not exit cleanly (code $NODE_EXIT) after SIGINT!"
            exit 1
          fi

      - name: Verify real rclpy node initialization and lifecycle
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -c "
          import rclpy
          from ros2.qerra_gate_node import QerraGateNode

          rclpy.init()
          node = QerraGateNode()
          print(f'[CI-TEST] Successfully instantiated {node.get_name()} under real rclpy!')
          assert node._lidar_n_expected == 682
          assert node._hsr_required is True
          assert node._hsr_source == 'udp'
          assert node._hsr_port == 5008
          node.destroy_node()
          rclpy.shutdown()
          print('[CI-TEST] Node lifecycle destroyed cleanly fail-closed.')
          "

      - name: Run ROS 2 gate node unit and wiring tests in Jazzy
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest tests/test_gate_ros2_node.py
          python3 -m unittest tests/test_gate_ros2_node_wiring.py

      - name: Run live ROS 2 topic traffic integration tests in Jazzy (Priority P9)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest tests/test_gate_ros2_live_traffic.py

      - name: Run live dual-protocol integration tests in Jazzy (Priority P10)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 -m unittest tests/test_gate_ros2_dual_protocol.py
