name: ROS 2 Jazzy Timing & Executor Benchmark

on:
  workflow_dispatch:
    inputs:
      ticks:
        description: 'Number of ticks per scenario'
        required: false
        default: '500'

jobs:
  benchmark-executor:
    name: Empirical Executor & Scheduling Benchmark
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/qerra_core

      - name: Install build tools and dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "nameserver 8.8.8.8" > /etc/resolv.conf || true
          echo "nameserver 1.1.1.1" >> /etc/resolv.conf || true

          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )

          UPDATED=0
          for attempt in 1 2 3; do
            echo "[CI] apt-get update attempt ${attempt}/3"
            if apt-get "${APT_OPTS[@]}" update; then
              UPDATED=1
              break
            fi
            sleep 5
          done

          if [ "$UPDATED" -ne 1 ]; then
            echo "[CI] ERROR: apt-get update failed after 3 attempts."
            exit 1
          fi

          apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            procps

          rosdep update
          cd ros2_ws
          rosdep install --from-paths src/qerra_core --ignore-src -r -y --rosdistro jazzy

      - name: Build qerra_core
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --packages-select qerra_core

      - name: Execute ROS 2 SingleThreadedExecutor Benchmark
        shell: bash
        env:
          ROS_DOMAIN_ID: "42"
        run: |
          . /opt/ros/jazzy/setup.bash
          . ros2_ws/install/setup.bash
          cd ros2_ws/src/qerra_core
          python3 tools/bench_ros2_executor.py --ticks ${{ github.event.inputs.ticks || '500' }}

      - name: Upload Benchmark JSON Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-executor-benchmark-results
          path: ros2_ws/src/qerra_core/tools/benchmark_executor_results.json
          if-no-files-found: warn
