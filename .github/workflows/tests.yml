name: QERRA-v2 CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
    timeout-minutes: 20
    env:
      QERRA_API_KEY: "TEST-2026-QERRA-CLASSICAL-PUBLIC-KEY-98765"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn python-dotenv pydantic slowapi httpx
          pip install sentence-transformers

      - name: Verify imports
        run: |
          python -c "import sentence_transformers; print('OK')"
          python -c "from vectors import get_semev12_vectors; print('OK')"
          python -c "import app; import values; print('OK')"
          python -c "import hsr; import gate; print('OK')"

      - name: Run Layer 1 (QERRA-HSR) physical reflex test suite
        run: python -m unittest discover -s hsr -t . -v

      - name: Run Layer 2 (SEMEV-12) regression benchmarks
        run: python -m tests.test_cases

      - name: Run Supervisory Gate (Demo 7) test suite
        run: |
          python -m unittest tests.test_gate_core tests.test_gate_ipc tests.test_gate_lidar tests.test_gate_link tests.test_gate_log -v

      - name: Run Fail-Closed Safety Bridge Tests
        run: python -m unittest tests.test_bridge_fail_closed -v

      - name: Run Unified 3-Layer Pipeline Integration Tests
        run: python test_pipeline_integration.py
