name: SEMEV-12 Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install sentence-transformers explicitly
        run: pip install sentence-transformers

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      - name: Verify sentence-transformers is available
        run: python -c "import sentence_transformers; print('sentence_transformers OK')"

      - name: Run SEMEV-12 tests
        run: PYTHONPATH=. python -m unittest test_vectors -v
