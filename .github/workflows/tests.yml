name: QERRA-v2 Classical Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers fastapi uvicorn python-dotenv pydantic slowapi
          pip install -e . --no-deps

      - name: Run Supervisory Gate Test Suite (stdlib only)
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_gate_*.py" -v

      - name: Run QERRA-HSR Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s hsr -p "test_*.py" -v

      - name: Run License Boundary Guard
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_license_boundary -v

      - name: Run SEMEV-12 Regression Suite
        env:
          PYTHONPATH: .
        run: |
          python -m tests.test_cases
