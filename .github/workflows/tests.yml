name: SEMEV-12 Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn python-dotenv pydantic slowapi
          pip install sentence-transformers

      - name: Verify imports
        run: |
          python -c "import sentence_transformers; print('OK')"
          python -c "from vectors import get_semev12_vectors; print('OK')"

      - name: Run SEMEV-12 regression suite
        run: python -m tests.test_cases
